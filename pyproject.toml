[project]
name = "influencer-analyzer"
version = "0.1.0"
description = "A simple Instagram influencer explorer"
requires-python = ">=3.11,<3.14"
dependencies = ["streamlit>=1.45,<2", "pandas>=2.2,<3", "plotly>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
